[workspace]
members = [
    "crates/moe-core",
    "crates/moe-ddel",
    "crates/moe-platform",
    "crates/moe-plugin-sdk",
    "crates/moe-runtime",
    "crates/moe-sdk",
    "crates/moe-uril",
    "crates/moe-validation-suite",
    "moe-llm-core",
    "moe-test",
    "moe-compute",
    "moe-data",
    "reproducibility_verifier",
]
resolver = "2"

[workspace.package]
version     = "1.5.0"
edition     = "2024"
license     = "LGPL-3.0-or-later"
repository  = "https://github.com/rfi-irfos/ternary-intelligence-stack"
homepage    = "https://rfi-irfos.com/"
authors     = [
    "Simeon Kepp <s.kepp@ternlang.com>",
    "Nikoletta Csonka <csonikoletta@ternlang.com>",
    "Zabih Karimi <z.karimi@ternlang.com>",
    "RFI-IRFOS <licensing@ternlang.com>"
]
keywords    = [
    "ternary-logic", "machine-learning", "inference-engine", "compiler", 
    "ai-safety", "explainable-ai", "sparsity", "rust-lang", "low-latency", 
    "post-binary", "quantization", "hpc", "deterministic"
]
categories  = ["compilers", "science", "embedded-programming", "development-tools::ffi"]
