[package]
name = "moe-llm-core"
version = "2.0.0"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Part of the MoE-13 Ternary Intelligence Stack"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "albert_serve"
path = "src/bin/albert_serve.rs"
required-features = ["serve"]

[[bin]]
name = "albert_trace"
path = "src/bin/albert_trace.rs"
required-features = ["trace"]

[features]
cuda  = ["candle-core/cuda", "candle-nn/cuda"]
trace = []
serve = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:anyhow"]

[dependencies]
candle-core = { version = "0.8.4" }
candle-nn   = { version = "0.8.4" }
tokenizers  = "0.21.0"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
rand        = "0.8.5"
rayon       = "1.10.0"
safetensors = "0.4"
axum        = { version = "0.8", optional = true }
tokio       = { version = "1",   features = ["full"], optional = true }
tower-http  = { version = "0.6", features = ["cors"], optional = true }
anyhow      = { version = "1",   optional = true }
